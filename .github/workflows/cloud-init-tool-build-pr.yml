name: Build Cloud Init Tool on PRs

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    paths:
    - 'cloud-init-tool/**'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - name: Build Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: cloud-init-tool
        file: ./cloud-init-tool/Dockerfile
        push: false
        tags: cloud-init-tool:latest
        cache-from: type=gha,scope=cloud-init-tool
        cache-to: type=gha,mode=max,scope=cloud-init-tool
